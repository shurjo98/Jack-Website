name: FTP Deploy to jackmachinerybd.com

on:
  push:
    branches: [main]

jobs:
  ftp-deploy:
    name: Deploy to jackmachinerybd.com
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FTPS Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.jackmachinerybd.com
          username: git@jackmachinerybd.com
          password: ${{ secrets.JACKMACHINERYBD_FTP_PASSWORD }}
          port: 21
          protocol: ftps
          server-dir: /public_html/
          state-name: .ftp-deploy-sync-state-2.json
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.DS_Store
